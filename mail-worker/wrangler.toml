name = "cloudmail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

# 直接绑自定义域名，不用 workers.dev 子域
workers_dev = false
routes = [
	{ pattern = "box.okkmail.cc", custom_domain = true },
	# 给别人的公开入口，根路径会重定向到 /find（见 index.js）
	{ pattern = "temp.okkmail.cc", custom_domain = true },
]

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloudmail-db"
database_id = "2eb6485c-8905-42aa-ac0d-32242ccbb72b"

[[kv_namespaces]]
binding = "kv"
id = "5776fdafeb654e05be1976193a7170fe"

[ai]
binding = "ai"

# 前端打包进 worker，不用单独部署 Pages
[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
domain = ["okkmail.cc"]
admin = "admin@okkmail.cc"

[secrets]
required = ["jwt_secret"]
