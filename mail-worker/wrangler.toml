name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = "7e6c5ae0-a7f2-438a-b7bd-76f27f79ec16"

[[kv_namespaces]]
binding = "kv"
id = "eccbd3af3e79418382c4c224556acdfa"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = ""

#[[send_email]]
#name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
#ai_model = ""
#analysis_cache = false
#orm_log = false
domain = []
admin = ""
jwt_secret = "9sdfJ72Hsdf93jsL2kdf8Ghsd72jhs"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
