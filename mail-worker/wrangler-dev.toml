name = "haoxi-cloud-mail-local"
main = "src/index.js"
compatibility_date = "2025-06-04"

[dev]
ip = "127.0.0.1"
port = 8787

[[d1_databases]]
binding = "db"
database_name = "haoxi-cloud-mail-local"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "r2"
bucket_name = "haoxi-cloud-mail-local"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
domain = ["haoxi1688.com"]
admin = "admin@haoxi1688.com"
local_dev = true
analysis_cache = false
