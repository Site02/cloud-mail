name: Check and deploy Haoxi Cloud Mail
on:
  push:
    branches: [main]
    paths: ['mail-worker/**', 'mail-vue/**', 'scripts/**', '.github/workflows/deploy-cloudflare.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cloud-mail-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
        working-directory: mail-worker
      - run: pnpm install --frozen-lockfile
        working-directory: mail-vue
      - run: pnpm test
        working-directory: mail-worker
      - run: python scripts/test-deploy.py
      - run: pnpm run build
        working-directory: mail-vue
      - name: Browser security regression
        run: |
          npm install --prefix "$RUNNER_TEMP/mail-browser" playwright
          "$RUNNER_TEMP/mail-browser/node_modules/.bin/playwright" install --with-deps chromium
          CLOUDMAIL_PLAYWRIGHT="$RUNNER_TEMP/mail-browser/node_modules/playwright" node scripts/test-browser.cjs

  deploy:
    if: github.event_name != 'pull_request' && github.repository_owner != 'maillab'
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      BOOTSTRAP_SECRET: ${{ secrets.BOOTSTRAP_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      NAME: ${{ vars.NAME || 'haoxi-cloud-mail' }}
      DOMAIN: ${{ vars.DOMAIN }}
      ADMIN: ${{ vars.ADMIN }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
        working-directory: mail-worker
      - run: pnpm install --frozen-lockfile
        working-directory: mail-vue
      - run: pnpm run build
        working-directory: mail-vue
      - run: python scripts/deploy.py
