<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临时邮箱 · 设计模拟</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}:root{--bg:#f5f7fb;--card:#fff;--alt:#edf2f8;--line:#d3dce6;--ink:#172432;--muted:#526174;--accent:#175cd3;--focus:#175cd3;--good:#187a5d}body.dark{color-scheme:dark;--bg:#0d1420;--card:#151f2c;--alt:#1d2b3b;--line:#364657;--ink:#eff3f8;--muted:#a7b5c5;--accent:#2563eb;--focus:#8cc4ff;--good:#47caa0}main{max-width:1160px;margin:auto}body{padding:0 24px 44px}header{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0;display:flex;align-items:center;gap:10px}.mark{background:var(--accent);color:white;border-radius:10px;width:34px;height:34px;display:grid;place-items:center}nav{display:flex;gap:8px}.grid{display:grid;grid-template-columns:370px minmax(0,1fr);gap:20px;margin-top:16px}section,form{border:1px solid var(--line);border-radius:14px;background:var(--card)}.card{padding:22px}h2{font-size:12px;color:var(--muted);margin:0;font-weight:700}.address{display:block;border:1px dashed var(--line);background:var(--alt);padding:13px;border-radius:9px;font:700 18px/1.35 ui-monospace,monospace;overflow-wrap:anywhere;margin:17px 0;text-align:left;width:100%;color:var(--ink)}label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}select{width:100%;min-height:46px;border:1px solid var(--muted);border-radius:9px;background:var(--card);color:var(--ink);padding:10px 12px;font:600 15px ui-monospace,monospace;cursor:pointer;direction:ltr}button,input{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:9px 14px;font-size:13px;font-weight:650;cursor:pointer}.hint{font-size:12px;color:var(--muted);margin:7px 0 12px}.new{width:100%}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.note{border-top:1px solid var(--line);padding-top:14px;margin:18px 0 0;color:var(--muted);font-size:12px}.manual{padding:18px;margin-top:16px}.manual div{display:flex;gap:8px}input{min-width:0;flex:1;min-height:44px;border:1px solid var(--muted);border-radius:9px;background:var(--card);padding:10px;color:var(--ink)}input::placeholder{color:var(--muted)}.history{padding:18px;margin-top:16px}.history h2{font-size:14px;color:var(--ink)}.history button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 4px;font:12px ui-monospace,monospace;overflow-wrap:anywhere}.history small{color:var(--muted);margin-inline-start:auto;white-space:nowrap}.history .active{background:var(--alt)}.clear{color:#b42332;font-size:12px;display:inline-block;padding-top:12px}.inbox{min-height:480px;overflow:hidden}.inbox-head{padding:19px 22px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.inbox h2{font-size:18px;color:var(--ink)}.inbox-head span{font:12px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.timer{font-size:12px;color:var(--muted)}.timer b{color:var(--good)}article{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}article strong{font-size:14px}article p{margin:5px 0 0;font-size:13px}article small{color:var(--muted);font-size:12px}.code{font:700 15px ui-monospace,monospace;letter-spacing:1px;color:var(--focus);border:1px solid var(--focus);padding:8px;border-radius:8px;background:var(--card)}.empty{text-align:center;padding:80px 20px;color:var(--muted)}footer{color:var(--muted);font-size:12px;margin-top:16px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}@media(max-width:767px){body{padding:0 16px 32px}header{padding:16px 0;min-height:68px}nav{width:100%}nav button{flex:1;min-width:0;padding-inline:8px}.grid{grid-template-columns:1fr;margin-top:12px;gap:16px}.card{padding:18px;order:0}aside{display:contents}.grid>div{order:1}.manual{order:2;margin-top:0}.history{order:3;margin-top:0}.inbox{min-height:320px}.address{font-size:17px}.inbox-head{padding:18px}article{padding:18px}}
</style><body><main><header><h1><span class="mark">✉</span>临时邮箱</h1><nav><button>自动 · 简体中文 ⌄</button><button>添加到主屏幕</button><button>登录</button></nav></header><div class="grid"><aside><section class="card"><h2>你的临时地址</h2><button class="address" id="address">t8d6e194b3c@qtmail.click</button><label for="domain">邮箱域名</label><select id="domain"><option value="okkmail.cc">@okkmail.cc</option><option selected value="qtmail.click">@qtmail.click</option><option value="qtgmail.click">@qtgmail.click</option><option value="random">随机域名</option></select><p class="hint" id="hint">切换域名会保留用户名。</p><button class="new" id="new">↻ 更换用户名</button><div class="actions"><button class="primary">▢ 复制地址</button><button>复制查询链接</button></div><p class="note">知道地址的人都能查看服务器仍保留的邮件和附件，请勿用它接收敏感信息。</p></section><form class="manual" onsubmit="return false"><label>输入已有邮箱地址</label><div><input placeholder="输入已有邮箱地址"><button>查询</button></div></form><section class="history"><h2>切换邮箱 <span id="count">2</span></h2><p class="hint">记录保存在此浏览器或应用中，不会自动清理。</p><div id="history"></div><span class="clear">清空本机记录</span></section></aside><div><section class="inbox"><div class="inbox-head"><div><h2>收件箱</h2><span id="inboxAddress">t8d6e194b3c@qtmail.click</span></div><div class="timer"><b>●</b> 28s 后刷新</div></div><div id="mails"><article><div><strong>示例服务</strong><p>登录验证码</p><small>验证码有效期为 10 分钟</small></div><div><small>10:24</small><p class="code">481 920</p></div></article><article><div><strong>示例商店</strong><p>订单确认</p><small>订单详情和附件已收到</small></div><small>10:18</small></article></div></section><footer>可在线查看服务器仍保留的邮件。本机副本不会自动清理，但存储空间不足或清除网站数据可能使其丢失。</footer></div></div></main><script>
let current='t8d6e194b3c@qtmail.click';let history=[current,'t8d6e194b3c@okkmail.cc'];const domains=['okkmail.cc','qtmail.click','qtgmail.click'];function render(){document.querySelector('#address').textContent=current;document.querySelector('#inboxAddress').textContent=current;document.querySelector('#history').replaceChildren(...history.map(a=>{let b=document.createElement('button');b.textContent='✉ '+a;b.className=a===current?'active':'';b.onclick=()=>{current=a;document.querySelector('#domain').value=a.split('@')[1];render()};return b}));document.querySelector('#count').textContent=history.length;document.querySelector('#mails').innerHTML=current==='t8d6e194b3c@qtmail.click'?'<article><div><strong>示例服务</strong><p>登录验证码</p><small>验证码有效期为 10 分钟</small></div><p class="code">481 920</p></article>':'<div class="empty">收件箱<br>尚未收到邮件</div>'}function use(a){current=a;if(!history.includes(a))history.unshift(a);render()}document.querySelector('#domain').onchange=e=>{document.querySelector('#hint').textContent=e.target.value==='random'?'下次生成时随机选择域名。':'切换域名会保留用户名。';if(e.target.value!=='random')use(current.split('@')[0]+'@'+e.target.value)};document.querySelector('#new').onclick=()=>{let d=document.querySelector('#domain').value;use('t'+Math.random().toString(16).slice(2,12)+'@'+(d==='random'?domains[Math.floor(Math.random()*3)]:d))};if(new URLSearchParams(location.search).get('theme')==='dark')document.body.classList.add('dark');render();
</script></body></html>
